spring:
  application:
    name: merine-rebuild
  lifecycle:
    # 与 server.shutdown=graceful 配套：最多等待 30s 让在途请求收尾
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  sql:
    init:
      mode: never

mybatis:
  # 多表关联与聚合的映射放 XML，按模块分目录；注解只用于简单固定 SQL
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # 结果列按构造参数名匹配 record，而不是按位置。默认按位置匹配：
    # 一旦 SELECT 的列顺序与 record 组件顺序不一致，就会把值塞进错误的字段，
    # 报错信息还停在类型转换上，很难一眼看出根因。
    arg-name-based-constructor-auto-mapping: true

server:
  address: 0.0.0.0
  port: 9002
  # 停机先停止接收新请求，把手上的请求做完；配合容器 stop_grace_period 才生效
  shutdown: graceful
  # 列表类响应（菜单、用户、字典）JSON 体积可观：实测 gzip 能压到三成左右
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/problem+json,text/plain,text/css,application/javascript
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      # 会话保存在服务端内存，Cookie 只带会话标识；重启后需要重新登录
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # 本地开发走 HTTP，因此这里必须为 false；部署到 HTTPS 环境时必须改为 true
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # 就绪探针显式纳入数据库；liveness 只反映进程存活
        readiness:
          include: readinessState, db

springdoc:
  api-docs:
    path: /api/openapi
  # 以 Java 用例归属分组；生成脚本通过 swagger-config 自动发现，不复制此清单。
  group-configs:
    - group: auth
      packages-to-scan: com.merine.rebuild.auth
    - group: system
      packages-to-scan: com.merine.rebuild.system
    - group: tasks
      packages-to-scan: com.merine.rebuild.task
    - group: intelligence
      packages-to-scan: com.merine.rebuild.intelligence
    - group: maritime
      packages-to-scan: com.merine.rebuild.maritime
    - group: agent
      packages-to-scan: com.merine.rebuild.agent
    - group: diagnostics
      packages-to-scan: com.merine.rebuild.bootstrap
  swagger-ui:
    path: /api/docs

merine:
  audit:
    # 审计流水保留期（天）：定时清理只删除超过这个天数的行，窗口内永不动。
    # 过期即永久删除，没有归档；需要更长的证据链时应先做导出，而不是把表一直留着。
    retention:
      days: 30
      # 每日定时清理：默认开启（低峰时刻），测试与本地编排可关。
      enabled: true
      cron: '0 30 3 * * *'
  agent:
    provider-encryption-key: ${MODEL_PROVIDER_ENCRYPTION_KEY:}
    chat:
      # 本地演示对话：仅 dev/test 且显式打开时注册脚本化替身；默认关闭，生产不注册。
      demo-enabled: false
      # PROVIDER 调真实模型（需要供应商与模型配置）；DEMO 只走本地替身，不回退。
      mode: PROVIDER
      # 是否请求上游在流式响应里返回 token 用量（stream_options.include_usage）。
      # DeepSeek 与千问官方都支持；遇到不支持的供应商时置为 false，用量记为未知。
      request-usage: true
  security:
    # 免密选择账号须同时启用 dev profile 和此开关；默认环境不注册该入口。
    dev-login-enabled: false
    # 接口文档默认要求登录（安全默认值）：OpenAPI 全量文档与 Swagger UI 会暴露
    # 全部接口形状，默认公开等于给未认证访问者一份完整地图。
    # 本地需要匿名查看文档时，显式改成 true（登录后访问同样可用）。
    public-api-docs: false
    # 内置管理员角色编码，逗号分隔（默认 SYSTEM_ADMIN）。
    # 这些角色在登录时展开为全部功能权限码，是漏配权限时的兜底，同时不可删除、
    # 权限只读、停用前必须仍有其它可用管理账号。其它角色按 sys_role_permission 判定。
    # 注意：权限码只决定能用哪些功能，数据范围（能看哪些业务数据）仍未实现。
    system-admin-role-codes: SYSTEM_ADMIN

logging:
  pattern:
    level: '%5p [requestId=%X{requestId}]'
