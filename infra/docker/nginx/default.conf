# 交付形态前端：静态站点 + /api 反向代理。
#
# 同源代理的意义：会话 Cookie 与 CSRF Cookie 的作用域与开发环境一致，
# 前端不需要知道后端地址，也不需要 CORS。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    # 安全响应头：接口侧另有 nosniff 等，这里覆盖静态资源与页面
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 构建产物带内容哈希，可以长缓存
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        # 入口文件不能缓存，否则发版后用户仍拿旧 HTML 去取旧哈希资源
        add_header Cache-Control "no-store" always;
    }

    # SSE：演示对话流式接口必须关闭响应缓冲，否则事件会被攒到最后一次性下发。
    # 只精确匹配流端点；状态查询与停止仍走下面的 /api/ 代理。
    location = /api/agent/chat {
        proxy_pass http://api:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 会话与 CSRF 都靠 Cookie，代理不能改写
        proxy_pass_request_headers on;
    }

    # SPA 兜底：刷新深链时交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
